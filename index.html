
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Editor y navegador HTML LC HTML Runner">
  <link rel="manifest" href="./manifest.json">
  <title>LC HTML Runner</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">LC</div>
    <div>
      <h1>HTML Runner</h1>
      <small>LC Universal Tools</small>
    </div>
  </div>
  <button id="installBtn" hidden>Instalar</button>
</header>

<main>

  <section class="toolbar">
    <button id="newBtn">＋ Nuevo</button>
    <button id="openBtn">📂 Abrir HTML</button>
    <button id="saveBtn">💾 Guardar</button>
    <input type="file" id="fileInput" accept=".html,.htm,text/html" hidden>
  </section>

  <section class="editor-section">
    <div class="section-title">
      <span>EDITOR HTML</span>
      <span id="fileName">Sin título.html</span>
    </div>

    <textarea id="codeEditor" spellcheck="false"
      autocapitalize="off" autocomplete="off"
      autocorrect="off"
      placeholder="Escribe o pega tu código HTML aquí..."></textarea>

    <div class="run-toolbar">
      <button id="runBtn" class="primary">▶ Ejecutar código</button>
      <button id="clearBtn">Limpiar</button>
    </div>
  </section>

  <section class="preview-section">
    <div class="preview-header">
      <strong>VISTA DEL NAVEGADOR</strong>
      <div>
        <button id="refreshBtn">↻</button>
        <button id="fullscreenBtn">⛶</button>
      </div>
    </div>

    <div id="browserBar">
      <span>🔒</span>
      <span>Vista local · LC HTML Runner</span>
    </div>

    <iframe id="preview"
      title="Vista previa HTML"
      sandbox="allow-scripts allow-forms allow-modals allow-popups"
      referrerpolicy="no-referrer"></iframe>
  </section>

  <section class="console-section">
    <div class="console-header">
      <strong>CONSOLA</strong>
      <button id="clearConsoleBtn">Borrar</button>
    </div>
    <pre id="consoleOutput">LC HTML Runner listo.</pre>
  </section>

</main>

<footer>
  LC HTML Runner · Luis Charlii
</footer>

<script src="./app.js"></script>
</body>
</html>
