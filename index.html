<script>
(() => {
  const clabe = "722969010061473580";
  const trigger = document.getElementById("lcDonateBtn");
  const details = document.getElementById("lcDonationDetails");
  const arrow = document.getElementById("lcArrow");
  const copy = document.getElementById("lcCopyBtn");

  trigger.addEventListener("click", () => {
    const opening = details.hidden;
    details.hidden = !opening;
    trigger.setAttribute("aria-expanded", String(opening));
    arrow.textContent = opening ? "⌃" : "⌄";
  });

  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(clabe);
    } catch {
      // Respaldo para iPhone/Safari si el portapapeles moderno falla
      const t = document.createElement("textarea");
      t.value = clabe;
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      try { document.execCommand("copy"); } catch {}
      document.body.removeChild(t);
    }
    copy.textContent = "¡Copiada!";
    setTimeout(() => (copy.textContent = "Copiar CLABE"), 2000);
  });
})();
</script>

function analyze(t){
 t=t.replace(/data:image\/[a-z+.-]+;base64,[A-Za-z0-9+\/=]+/gi,"data:image/…");
 const starts=[0];for(let i=0;i<t.length;i++)if(t[i]==="\n")starts.push(i+1);

  if(seen.size)out.push({sev,w,name,why,hits:[...seen.keys()].map(n=>[n+1,lines[n]]),n:seen.size,id:name});
 });

 const CAT=/^(?:eva[l]|Functio[n]|cooki[e]|ato[b]|fromCharCod[e]|XMLHttpReques[t]|sendBeaco[n]|fetc[h]|WebSocke[t]|innerHTM[L]|writ[e]|setTimeou[t]|setInterva[l])$|<scrip[t]|<ifram[e]|javascrip[t]:|document\.cooki[e]|eva[l]\(/i;
 const cre=/(?:"[^"\n]{0,30}"|'[^'\n]{0,30}')(?:\s*\+\s*(?:"[^"\n]{0,30}"|'[^'\n]{0,30}')){1,}/g;

 while((cm=cre.exec(t))){const ps=cm[0].match(/"[^"\n]*"|'[^'\n]*'/g)||[];const j=ps.map(s=>s.slice(1,-1)).join("");if(CAT.test(j))parts.push([lineOf(cm.index)+1,cm[0]+" → "+j])}
 if(parts.length)out.push({sev:3,w:22,name:"Palabra peligrosa armada por partes",why:"Divide una palabra peligrosa en trozos para que no se lea. Es una evasión intencional.",hits:parts,n:parts.length});
 const SUS=/\.(?:tk|ml|ga|cf|gq|top|xyz|click|zip|mov|icu|buzz|cyou|monster|rest|cam|loan|work|country|kim|men|party|review|stream|download|gdn)$|^xn--|\.xn--/i;
 const SHORT=/^(?:bit\.ly|tinyurl\.com|t\.co|goo\.gl|is\.gd|cutt\.ly|rebrand\.ly|shorturl\.at|ow\.ly|tiny\.cc|rb\.gy|v\.gd)$/i;
 const DDNS=/(?:duckdns\.org|ngrok\.io|ngrok-free\.app|ngrok\.app|serveo\.net|trycloudflare\.com|ddns\.net|no-ip\.(?:com|org|biz)|hopto\.org|zapto\.org|loca\.lt|localtunnel\.me)$/i;

 const ure=/\b(?:https?|wss?|ftp):\/\/([^\s"'<>)\/?#`]+)([^\s"'<>)`]*)/gi;
 const C={x:[],l:[],u:[],i:[],s:[],d:[],t:[]};let um;
 while((um=ure.exec(t))){
  let host=um[1].toLowerCase();const url=um[0],ln=lineOf(um.index)+1,full=host.split("@").pop()+um[2].toLowerCase();

 }
 [["x",3,25,"Canal externo para recibir datos","Webhook o bot (Discord, Telegram y similares) que recibe lo que el código envía. Es la salida más usada para robar información."],

 ].forEach(([k,sv,w,nm,why])=>{if(C[k].length)out.push({sev:sv,w:w,name:nm,why:why,hits:C[k],n:C[k].length})});
