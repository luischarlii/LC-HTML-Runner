
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="LC HTML Runner - Editor y navegador HTML">
  <link rel="manifest" href="./manifest.json">
  <title>LC HTML Runner</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">LC</div>
    <div>
      <h1>HTML Runner</h1>
      <small>LC Universal Tools</small>
    </div>
  </div>
  <button id="installBtn" hidden>Instalar</button>
</header>

<main>

  <section class="toolbar">
    <button id="newBtn">＋ Nuevo</button>
    <button id="openBtn">📂 Abrir</button>
    <button id="saveBtn">💾 Guardar</button>
    <button id="downloadBtn">⬇️ Descargar</button>
    <input type="file" id="fileInput" accept=".html,.htm,text/html" hidden>
  </section>

  <section class="editor-section">

    <div class="section-title">
      <span>EDITOR</span>
      <span id="fileName">Sin título.html</span>
    </div>

    <div class="editor-tabs">
      <button class="editor-tab active" data-editor="html">HTML</button>
      <button class="editor-tab" data-editor="css">CSS</button>
      <button class="editor-tab" data-editor="js">JS</button>
    </div>

    <textarea id="htmlEditor" class="code-editor"
      spellcheck="false" autocapitalize="off"
      autocomplete="off" autocorrect="off"
      placeholder="Escribe o pega tu código HTML aquí..."></textarea>

    <textarea id="cssEditor" class="code-editor"
      spellcheck="false" autocapitalize="off"
      autocomplete="off" autocorrect="off"
      placeholder="Escribe tu código CSS aquí..." hidden></textarea>

    <textarea id="jsEditor" class="code-editor"
      spellcheck="false" autocapitalize="off"
      autocomplete="off" autocorrect="off"
      placeholder="Escribe tu código JavaScript aquí..." hidden></textarea>

    <div class="run-toolbar">
      <button id="runBtn" class="primary">▶ Ejecutar</button>
      <button id="stopBtn">■ Detener</button>
      <button id="clearBtn">Limpiar</button>
    </div>

  </section>

  <!-- NAVEGADOR -->
  <section class="preview-section">

    <div class="preview-header">
      <strong>🌐 VISTA DEL NAVEGADOR</strong>
      <div>
        <button id="refreshBtn">↻</button>
        <button id="fullscreenBtn">⛶</button>
      </div>
    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <div class="browser-controls">

      <button id="backBtn" title="Atrás">←</button>
      <button id="forwardBtn" title="Adelante">→</button>
      <button id="homeBtn" title="Inicio">🏠</button>

      <input
        id="urlInput"
        type="text"
        inputmode="url"
        autocomplete="off"
        placeholder="Escribe una dirección web..."
        value="local://lc-html-runner"
      >

      <button id="goBtn">Ir</button>
      <button id="browserRefreshBtn" title="Recargar">↻</button>

    </div>

    <iframe
      id="preview"
      title="Vista previa HTML"
      sandbox="allow-scripts allow-forms allow-modals allow-popups"
      referrerpolicy="no-referrer">
    </iframe>

  </section>

  <!-- CONSOLA -->
  <section class="console-section">

    <div class="console-header">
      <strong>🖥️ CONSOLA</strong>
      <button id="clearConsoleBtn">Borrar</button>
    </div>

    <pre id="consoleOutput">LC HTML Runner listo.</pre>

  </section>

</main>

<footer>
  LC HTML Runner · Luis Charlii
</footer>

<script src="./app.js"></script>

</body>
</html>
