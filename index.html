<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LC Runner">
<meta name="theme-color" content="#0b1020">
<title>LC HTML Runner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1020;--p:#161d33;--t:#f2f4fa;--m:#8b94b3;--g:#f5b301;--b:#27304d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:15px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column}
header{flex:none;background:#070b18;border-bottom:2px solid var(--g)}header img{display:block;width:100%;max-width:760px;margin:0 auto}
main{flex:1;min-height:0;position:relative}
.v{position:absolute;inset:0;display:none;flex-direction:column}.v.on{display:flex}
.bar{display:flex;gap:6px;padding:8px;background:var(--p);border-bottom:1px solid var(--b);align-items:center;flex-wrap:wrap}
button,select{background:var(--b);color:var(--t);border:0;border-radius:8px;padding:9px 12px;font-size:15px}
button.g{background:var(--g);color:#111;font-weight:700}button:disabled{opacity:.35}
input{flex:1;min-width:110px;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:9px;font-size:15px}
textarea{flex:1;width:100%;background:#0d1326;color:#dfe6ff;border:0;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;resize:none;outline:0;tab-size:2}
iframe{flex:1;border:0;background:#fff;width:100%}
#list{overflow:auto;padding:10px;display:grid;gap:8px;align-content:start}
.it{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:12px;display:flex;gap:8px;align-items:center}
.it b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it small{color:var(--m)}
.tag{color:var(--g);font-weight:700;font-size:11px;margin-right:6px}
nav{flex:none;display:flex;background:var(--p);border-top:1px solid var(--b)}
nav button{flex:1;border-radius:0;background:none;color:var(--m);padding:13px 4px}nav button.on{color:var(--g);box-shadow:inset 0 2px var(--g)}
.empty{color:var(--m);text-align:center;padding:30px}
@media(min-width:900px){nav{display:none}main{display:flex}.v{position:static;display:flex;flex:1}#vL{max-width:300px}}
#lcaM{display:none;position:fixed;inset:0;z-index:50;background:rgba(5,8,18,.82);align-items:center;justify-content:center;padding:14px}
#lcaM.on{display:flex}
.lcaP{background:var(--p);border:1px solid var(--b);border-radius:14px;width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#lcaB{overflow:auto;padding:14px}
.lcaA{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--b)}.lcaA button{flex:1}
button.r{background:#7a2530;color:#fff}
.lcaS{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lcaR{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--b) 0)}
.lcaR b{width:48px;height:48px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-size:17px}
.lcaW{background:#3a2a10;border:1px solid #f0a93b;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.lcaW b{color:#f0a93b}
.lcaF{border:1px solid var(--b);border-left-width:5px;border-radius:8px;padding:9px 11px;margin-bottom:8px}
.lcaF.s3{border-left-color:#ff6b5e}.lcaF.s2{border-left-color:#f0a93b}.lcaF.s1{border-left-color:#6fd19a}
.lcaF b{display:block;font-size:14px}.lcaF small{display:block;color:var(--m);margin:2px 0 4px}
.lcaF code{display:block;background:var(--bg);border-radius:5px;padding:3px 7px;margin-top:3px;font:11.5px/1.5 ui-monospace,Menlo,monospace;overflow-x:auto;white-space:pre}
</style></head><body>

function scanModal(r,x){
 const B=$('lcaB'),A=$('lcaA'),lv=LV(r.score);B.textContent='';A.textContent='';
 const s=el('div','lcaS'),ring=el('div','lcaR');ring.style.cssText='--c:'+lv[1]+';--p:'+r.score;ring.append(el('b','',r.score));
 const tx=el('div'),h=el('b','',lv[0]),sub=el('div','',x?'Se encontraron señales sospechosas antes de ejecutar.':'Resultado del análisis. El código no se ejecutó.');
 h.style.fontSize='16px';sub.style.cssText='color:var(--m);font-size:13px';tx.append(h,sub);s.append(ring,tx);B.append(s);
 if(r.obf.length){const w=el('div','lcaW');w.append(el('b','','Parece código ofuscado. '),'Señales: '+r.obf.join(', ')+'. Desofúscalo y vuelve a analizarlo: el puntaje puede quedarse corto.');B.append(w)}
 if(!r.f.length)B.append(el('div','empty','No se encontraron señales sospechosas.'));
 r.f.slice(0,10).forEach(g=>{const d=el('div','lcaF s'+g.sev);d.append(el('b','',g.name),el('small','',g.why));
  g.hits.slice(0,2).forEach(([l,c])=>d.append(el('code','',l+'  '+c.trim().slice(0,110))));B.append(d)});
 if(r.f.length>10)B.append(el('div','empty','+ '+(r.f.length-10)+' hallazgos más'));
 if(x){const c=el('button','g','Cancelar'),e=el('button','r','Ejecutar de todos modos');c.onclick=closeM;e.onclick=()=>{closeM();runIt(x,true);show('vP')};A.append(c,e)}
 else{const c=el('button','g','Cerrar');c.onclick=closeM;A.append(c)}
 $('lcaM').classList.add('on')}
function runIt(x,force){const t=x.type||'html';
 if(!force&&(t==='html'||t==='js')){const r=LCA.check(x.code);if(r.grave||r.score>=35){scanModal(r,x);return false}}
 nav({k:'c',v:inject(build(t,x.code)),n:x.name});return true}
$('run').onclick=()=>{if(runIt({type:$('type').value,code:$('code').value,name:$('name').value||'(borrador)'}))show('vP')};
$('save').onclick=()=>{const n=$('name').value.trim()||'Sin título',c=$('code').value,t=$('type').value;
 let it=cur&&items.find(x=>x.id===cur);
 if(it){it.name=n;it.code=c;it.type=t;it.t=Date.now()}else{it={id:Date.now().toString(36),name:n,code:c,type:t,t:Date.now()};items.unshift(it);cur=it.id}
 store();render();$('save').textContent='✓ Guardado';setTimeout(()=>$('save').textContent='Guardar',1200)};
$('new').onclick=()=>{cur=null;$('name').value='';$('code').value=TPL[$('type').value]};
$('type').onchange=()=>{const c=$('code').value;if(!c.trim()||Object.values(TPL).includes(c))$('code').value=TPL[$('type').value]};
$('code').oninput=()=>{try{localStorage.setItem('lcr_draft',$('code').value)}catch(e){}};
$('code').onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'  ')}};
$('bk').onclick=()=>{if(pos>0){pos--;draw()}};$('fw').onclick=()=>{if(pos<hist.length-1){pos++;draw()}};
$('rl').onclick=draw;
$('scan').onclick=()=>scanModal(LCA.check($('code').value),null);
$('lcaM').onclick=e=>{if(e.target.id==='lcaM')closeM()};
function go(){let v=$('url').value.trim();if(!v)return;
 const it=items.find(x=>x.name.toLowerCase()===v.toLowerCase());
 if(it)return runIt(it);
 if(!/^https?:\/\//i.test(v))v='https://'+v;nav({k:'u',v})}
$('go').onclick=go;$('url').onkeydown=e=>{if(e.key==='Enter')go()};
function render(){const q=$('q').value.toLowerCase(),l=$('list');l.innerHTML='';
 const f=items.filter(x=>x.name.toLowerCase().includes(q));
 if(!f.length){l.innerHTML='<div class="empty">'+(items.length?'Sin resultados':'Aún no tienes códigos guardados')+'</div>';return}
 f.forEach(x=>{const d=document.createElement('div');d.className='it';
  d.innerHTML='<div style="flex:1;min-width:0"><b></b><small><span class="tag"></span></small></div><button>▶</button><button>✏️</button><button>🗑</button>';
  d.querySelector('b').textContent=x.name;d.querySelector('.tag').textContent=(x.type||'html').toUpperCase();
  d.querySelector('small').append(new Date(x.t).toLocaleString('es'));
  const[b1,b2,b3]=d.querySelectorAll('button');
  b1.onclick=()=>{if(runIt(x))show('vP')};
  b2.onclick=()=>{cur=x.id;$('name').value=x.name;$('type').value=x.type||'html';$('code').value=x.code;show('vE')};
  b3.onclick=()=>{if(confirm('¿Eliminar "'+x.name+'"?')){items=items.filter(i=>i!==x);if(cur===x.id)cur=null;store();render()}};
  l.appendChild(d)})}
$('q').oninput=render;
$('exp').onclick=()=>{const t=JSON.stringify(items,null,1);
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='lc-runner-respaldo.json';a.click()}catch(e){prompt('Copia tu respaldo:',t)}};
$('imp').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.json,application/json';
 f.onchange=async()=>{try{const a=JSON.parse(await f.files[0].text());if(!Array.isArray(a))throw 0;
  a.forEach(x=>{if(x&&x.code!=null&&!items.some(i=>i.id===x.id))items.push({id:x.id||Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:x.name||'Sin título',code:x.code,type:x.type||'html',t:x.t||Date.now()})});
  items.sort((a,b)=>b.t-a.t);store();render()}catch(e){alert('Archivo de respaldo no válido.')}};f.click()};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();draw();
</script>
<!-- ===== 3. Contador de usuarios ===== -->
<!-- Cambia el valor de APP por el nombre de la app donde lo instales -->
<script>
(function () {
  var APP = "runner";
  var ENDPOINT = "https://contador.paragugliar.workers.dev/ping";
  try {
    var id = localStorage.getItem("uid");
    if (!id) {
      id = crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2);
      localStorage.setItem("uid", id);
    }
    var hoy = new Date().toDateString();
    if (localStorage.getItem("ping_" + APP) === hoy) return; // ya se reportó hoy
    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ app: APP, id: id }),
      keepalive: true,
    }).then(function () { localStorage.setItem("ping_" + APP, hoy); }).catch(function () {});
  } catch (e) {}
})();
</script>
